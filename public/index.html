<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="问卷工作台">
<meta name="theme-color" id="metaTheme" content="#f1f7f5">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>问卷工作台 · 创建/管理/分析问卷</title>
<link rel="stylesheet" href="/style.css">
<script>
(function(){try{
  var d=(localStorage.getItem('qwDark')==='1')||(localStorage.getItem('qwDark')===null&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(d)document.documentElement.classList.add('dark');
  var t=document.querySelector('meta[name=theme-color]');
  if(t)t.setAttribute('content',d?'#0d1412':'#f1f7f5');
}catch(e){}})();
</script>
</head>
<body>
<div class="app" id="app">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo" onclick="location.hash='#/'" style="cursor:pointer">
        <div class="logo-badge">卷</div>
        <span>问卷工作台</span>
      </div>
      <div class="header-spacer"></div>
      <button class="btn btn-ghost btn-sm hide-sm" id="navAiBtn" onclick="location.hash='#/ai'">✨ AI 生成</button>
      <button class="btn btn-ghost btn-sm hide-sm" id="navLinksBtn" onclick="location.hash='#/links'">🔗 友链</button>
      <button class="btn btn-ghost btn-sm" id="navHomeBtn" onclick="location.hash='#/'">问卷列表</button>
      <button class="icon-btn" id="themeToggle" title="切换深浅色">◐</button>
    </div>
  </header>

  <main class="container">
    <!-- 仪表盘 -->
    <section class="page" id="view-dashboard">
      <div class="page-head">
        <div>
          <h1>我的问卷</h1>
          <div class="sub">创建、回收、分析，一站式完成</div>
        </div>
        <div class="right">
          <button class="btn btn-soft" onclick="location.hash='#/ai'">✨ AI 一键生成</button>
          <button class="btn btn-primary" onclick="App.createBlank()">＋ 新建问卷</button>
        </div>
      </div>
      <div class="stat-grid" id="statGrid"></div>
      <div id="surveyList"></div>
    </section>

    <!-- AI 生成 -->
    <section class="page" id="view-ai" style="display:none">
      <div class="page-head">
        <div>
          <h1>AI 一键生成问卷</h1>
          <div class="sub">告诉 AI 你想收集什么，它会联网检索资料并自动设计整份问卷</div>
        </div>
      </div>
      <div class="ai-gen-card">
        <div class="ai-banner" id="aiBanner"></div>
        <label class="field">
          <span class="f-label">你想收集什么内容？</span>
          <textarea class="textarea topic-input" id="aiTopic" placeholder="例如：我想收集一个《光遇》游戏产品玩法的问卷，了解玩家对游戏玩法、社交系统、氪金内容的满意度与建议"></textarea>
        </label>
        <div class="gen-options">
          <label class="opt"><input type="checkbox" id="aiSearch" checked> 先联网检索相关资料（尽力而为）</label>
          <label class="opt">题目数量
            <select class="select" id="aiCount">
              <option value="5">5 题</option>
              <option value="8" selected>8 题</option>
              <option value="10">10 题</option>
              <option value="12">12 题</option>
              <option value="15">15 题</option>
            </select>
          </label>
        </div>
        <button class="btn btn-primary btn-lg" id="aiGenBtn" onclick="App.aiGenerate()">一键生成问卷</button>
        <div id="aiResult"></div>
      </div>
    </section>

    <!-- 编辑器 -->
    <section class="page" id="view-editor" style="display:none">
      <div class="page-head" id="editorHead"></div>
      <div class="editor-grid">
        <div class="editor-left" id="editorLeft"></div>
        <div class="editor-right">
          <div class="card preview-pane">
            <div class="fill-wrap" id="editorPreview"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 结果页 -->
    <section class="page" id="view-results" style="display:none">
      <div id="resultsBody"></div>
    </section>

    <!-- 友链（读主站 FF大王博客，自动同步） -->
    <section class="page" id="view-links" style="display:none">
      <div class="page-head">
        <div>
          <h1>友链</h1>
          <div class="sub">来自主站 FF大王博客 · 云端同步 · 点击直达</div>
        </div>
      </div>
      <div class="link-src-row">
        <input class="input" type="url" id="linksSrcInput" placeholder="主站友链地址（默认 ffdaz-blog.pages.dev/api/links）">
        <button class="btn btn-soft" id="linksSrcSave">保存</button>
      </div>
      <div class="link-hint" id="linksSrcHint">主站新增友链后，这里自动同步显示。</div>
      <div class="link-list" id="linkList"></div>
    </section>
  </main>
</div>

<!-- 锁屏 -->
<div class="lock-screen" id="lockScreen" style="display:none">
  <div class="lock-card">
    <div class="logo-badge">卷</div>
    <h1>问卷工作台</h1>
    <div class="sub">此后台已启用访问验证，请输入管理密码</div>
    <div class="err" id="lockErr"></div>
    <input class="input" type="password" id="lockPwd" placeholder="管理密码" autocomplete="current-password">
    <button class="btn btn-primary" id="lockBtn" style="width:100%">进入工作台</button>
  </div>
</div>

<div id="toast-wrap"></div>

<!-- 跨站公告弹窗（公告源：FF大王博客，只读） -->
<div class="notice-mask" id="noticeMask">
  <div class="notice-card" role="dialog" aria-modal="true">
    <div class="notice-head">
      <span class="notice-badge"></span>
      <div class="notice-title" id="noticeTitle">更新公告</div>
      <button class="notice-close" id="noticeClose" title="关闭">✕</button>
    </div>
    <div class="notice-body" id="noticeBody"></div>
    <div class="notice-foot">
      <label><input type="checkbox" id="noticeNotifyCb"> 每次公告更新都提醒我</label>
      <button class="notice-btn" id="noticeOk">知道了</button>
    </div>
  </div>
</div>

<script>
/* ===== 跨站公告弹窗（公告源：FF大王博客 https://ffdaz-blog.pages.dev） ===== */
(function(){
  var SRC_LS='qwNoticeSource';
  var SEEN_LS='qwNoticeSeen';
  var NOTIFY_LS='qwNoticeNotify';
  var DEF_SRC='https://ffdaz-blog.pages.dev';
  var mask=document.getElementById('noticeMask');
  var titleEl=document.getElementById('noticeTitle');
  var bodyEl=document.getElementById('noticeBody');
  var cb=document.getElementById('noticeNotifyCb');
  var okBtn=document.getElementById('noticeOk');
  var closeBtn=document.getElementById('noticeClose');
  var current=null;

  function srcBase(){
    try{ var v=String(localStorage.getItem(SRC_LS)||'').trim(); if(v) return v.replace(/\/+$/,''); }catch(e){}
    return DEF_SRC;
  }
  /* 简易 Markdown → HTML（够弹窗用：标题/粗体/列表/代码/引用/链接/段落） */
  function md2html(src){
    var s=String(src||'');
    s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s=s.replace(/```([\s\S]*?)```/g,function(m,c){ return '<pre><code>'+c.trim()+'</code></pre>'; });
    s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>');
    s=s.replace(/^## (.*)$/gm,'<h2>$1</h2>');
    s=s.replace(/^# (.*)$/gm,'<h1>$1</h1>');
    s=s.replace(/^[-*] (.*)$/gm,'<li>$1</li>');
    s=s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
    s=s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
    s=s.replace(/^(?!<[hupbl]|<\/|&gt;)(.+)$/gm,'<p>$1</p>');
    return s;
  }
  function keyOf(a){ return String(a.id)+'_'+(a.updatedAt||0); }
  function shouldShow(a){
    if(!a||!a.title) return false;
    var key=keyOf(a), seen=null, notify=false;
    try{ seen=localStorage.getItem(SEEN_LS); notify=localStorage.getItem(NOTIFY_LS)==='1'; }catch(e){}
    if(seen===key) return false;
    if(seen && !notify) return false;
    return true;
  }
  function openNotice(a){
    if(!a||!mask||!titleEl||!bodyEl) return;
    current=a;
    titleEl.textContent=a.title||'更新公告';
    bodyEl.innerHTML=md2html(a.content||'');
    try{ cb.checked=localStorage.getItem(NOTIFY_LS)==='1'; }catch(e){}
    mask.classList.add('show');
  }
  function dismiss(){
    try{
      if(current) localStorage.setItem(SEEN_LS,keyOf(current));
      localStorage.setItem(NOTIFY_LS,cb&&cb.checked?'1':'0');
    }catch(e){}
    if(mask) mask.classList.remove('show');
  }
  function pull(){
    fetch(srcBase()+'/api/public-notice',{credentials:'omit'}).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(function(d){
      if(!d||!d.ok||!d.notice) return;
      if(shouldShow(d.notice)) openNotice(d.notice);
    }).catch(function(){});
  }
  if(okBtn) okBtn.addEventListener('click',dismiss);
  if(closeBtn) closeBtn.addEventListener('click',dismiss);
  if(mask) mask.addEventListener('click',function(ev){ if(ev.target===mask) dismiss(); });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') dismiss(); });
  /* 页面打开后延迟拉取，失败静默 */
  setTimeout(function(){ try{ pull(); }catch(e){} }, 1400);
})();
</script>
<script src="/renderer.js"></script>
<script src="/app.js"></script>
<script>
/* ===== 友链（读主站 FF大王博客 /api/links，自动同步） ===== */
(function(){
  var SRC_LS='qwLinksSrc';
  var DEF_SRC='https://skyzyf335.top/api/links';
  function srcBase(){
    try{ var v=String(localStorage.getItem(SRC_LS)||'').trim(); if(v) return v.replace(/\/+$/,''); }catch(e){}
    return DEF_SRC;
  }
  function logoInfo(url){
    try{ var u=new URL(url); var d=u.hostname.replace(/^www\./,'');
      return { primary:'https://'+d+'/favicon.ico', fallback:'https://icons.duckduckgo.com/ip3/'+d+'.ico', initial:(d.charAt(0)||'?').toUpperCase() };
    }catch(e){ return null; }
  }
  function loadLinks(){
    var box=document.getElementById('linkList');
    var hint=document.getElementById('linksSrcHint');
    var inp=document.getElementById('linksSrcInput');
    if(!box) return;
    if(inp && !inp.value) inp.value=srcBase();
    if(hint) hint.textContent='正在从主站读取友链…';
    box.innerHTML='<div class="link-empty">正在从主站读取友链…</div>';
    fetch(srcBase(),{method:'GET'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        var list=Array.isArray(d&&d.links)?d.links:[];
        if(!list.length){ if(hint) hint.textContent='主站已连接，当前暂无友链。'; box.innerHTML='<div class="link-empty">主站暂无友链，去主站添加后会同步到这里。</div>'; return; }
        if(hint) hint.textContent='已同步主站 '+list.length+' 条友链 · 自动跟随更新。';
        box.innerHTML=list.map(function(l){
          var info=logoInfo(l.url);
          var img=info
            ? '<span class="link-logo-wrap"><img class="link-logo" src="'+info.primary+'" alt="" loading="lazy" onerror="this.style.display=\'none\';var p=this.nextElementSibling;if(p)p.style.display=\'flex\';"><span class="link-logo-fb" style="display:none">'+info.initial+'</span></span>'
            : '<span class="link-logo-wrap"><span class="link-logo-fb">?</span></span>';
          return '<a class="link-item" href="'+String(l.url).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" target="_blank" rel="noopener nofollow">'+img+
            '<span class="link-mid"><span class="link-title"></span><span class="link-url"></span></span></a>';
        }).join('');
        box.querySelectorAll('.link-item').forEach(function(a,i){
          var t=a.querySelector('.link-title'); if(t) t.textContent=list[i].title;
          var u=a.querySelector('.link-url'); if(u) u.textContent=String(list[i].url).replace(/^https?:\/\//,'');
        });
      })
      .catch(function(e){
        if(hint) hint.textContent='读取失败：'+e.message+'。请确认主站地址正确且已部署。';
        box.innerHTML='<div class="link-empty">读取失败：'+e.message+'<br>请检查主站地址是否正确、主站是否已部署。</div>';
      });
  }
  var save=document.getElementById('linksSrcSave');
  var inp=document.getElementById('linksSrcInput');
  if(save && inp){
    save.addEventListener('click',function(){
      var v=String(inp.value||'').trim().replace(/\/+$/,'');
      if(!v) return;
      try{ localStorage.setItem(SRC_LS,v); }catch(e){}
      loadLinks();
    });
  }
  window.__loadLinks=loadLinks;
})();
</script>
</body>
</html>
