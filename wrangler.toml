# ============================================================
# 问卷工作台 · Cloudflare Pages 配置
# 部署：wrangler pages deploy（需先 wrangler login）
# ============================================================
name = "survey-workbench"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# ---------- D1 数据库（问卷与答卷的持久化存储）----------
# 1) 创建数据库：wrangler d1 create survey-workbench
# 2) 把返回的 database_id 填到下面
# 3) 建表（应用首次访问也会自动建表，可跳过）：
#    wrangler d1 execute survey-workbench --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "survey-workbench"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# ---------- 加密密文（CF Secrets，不写入仓库）----------
# DEEPSEEK_API_KEY   DeepSeek API 密钥（必填，AI 生成/分析依赖）
#                    设置：wrangler pages secret put DEEPSEEK_API_KEY
# ADMIN_PASSWORD     管理后台访问密码（可选；不设置则后台完全开放，建议生产环境务必设置）
#                    设置：wrangler pages secret put ADMIN_PASSWORD
